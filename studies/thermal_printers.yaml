# Example study. Brands and products are fictional placeholders.
# Replace them with the real thermal-printer line-up in Sprint 1.
id: thermal_printers
name: Thermal label printers (sample)
description: >
  Direct-thermal label printers used for shipping labels, barcodes and
  receipts by small e-commerce sellers, warehouses and home offices.
category: hardware_device
regions: [US]
languages: [en]

products:
  - {id: nimbus_n1, name: Nimbus N1, brand: Nimbus}
  - {id: kestrel_k2, name: Kestrel K2, brand: Kestrel, is_competitor: true}

aspects:
  - key: print_quality
    description: Sharpness, darkness, barcode scannability, smudging, fading
    keywords: [crisp, sharp, clear, faded, blurry, smudge, scannable, print quality]
  - key: setup_installation
    description: Unboxing, first-time setup, pairing, getting the first label printed
    keywords: [setup, set up, install, installation, plug and play, pairing]
  - key: driver_software
    description: Drivers, desktop/mobile app, firmware, OS compatibility
    keywords: [driver, software, app, firmware, mac, windows, update]
  - key: connectivity
    description: USB, Bluetooth, Wi-Fi reliability
    keywords: [bluetooth, wifi, wi-fi, usb, disconnect, connection]
  - key: reliability_durability
    description: Jams, failures, lifespan, consistent operation over time
    keywords: [jam, jams, broke, stopped working, died, reliable, durable, lasted]
  - key: speed
    description: Printing speed and throughput
    keywords: [fast, speed, slow, quick]
  - key: label_compatibility
    description: Works with third-party/generic labels, sizes, feeding
    keywords: [labels, generic labels, label size, roll, fanfold, feed]
  - key: price_value
    description: Price, value for money, cost of consumables
    keywords: [price, cheap, expensive, value, worth, money]
  - key: customer_support
    description: Support interactions, warranty, returns handling
    keywords: [support, customer service, warranty, refund, replacement]
  - key: platform_integration
    description: Works with shipping/e-commerce platforms and carriers
    keywords: [shopify, etsy, ebay, amazon, ups, usps, fedex, shipstation]

sources:
  - {type: file, name: sample_reviews, legal_basis: synthetic sample data}

jev:
  accept_threshold: 0.7
  audit_sample_rate: 0.1
  use_llm_judge: true

llm:
  model: claude-opus-5
  effort: null   # tune on the golden dev split

alerts:
  min_weekly_volume: 3
  z_threshold: 2.0
  min_share_jump: 0.15
